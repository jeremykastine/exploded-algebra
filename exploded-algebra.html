<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8">
    <title>Exploded Algebra Tool</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            font-family: Verdana, Arial, Helvetica, sans-serif;
            background: white;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .app-container {
            display: flex;
            width: 100%;
            min-height: 100vh;
            align-items: stretch;
        }

        .left-panel {
            width: 33.333%;
            min-width: 10%;
            max-width: 50%;
            overflow-x: hidden;
            overflow-y: visible;
            border-right: 1px solid #ccc;
            padding: 10px;
            box-sizing: border-box;
            background: #fafafa;
        }


        .left-panel h2 {
            margin: 0 0 12px 0;
            font-size: 18px;
        }

        .left-panel p {
            margin: 0 0 10px 0;
            line-height: 1.4;
        }

        .left-panel .math-block {
            margin: 10px 0 14px 0;
            padding: 8px;
            background: transparent;
            border: 1px solid #e2e2e2;
            border-radius: 6px;
        }

        .level-intro {
            color: #444;
        }

        .panel-label {
            display: block;
            font-size: 13px;
            margin: 10px 0 6px 0;
            color: #444;
        }

        .panel-select {
            width: 100%;
            box-sizing: border-box;
            padding: 7px 8px;
            font-size: 14px;
            border: 1px solid #999;
            background: white;
            margin-bottom: 14px;
        }

        .level-title {
            font-size: 16px;
            font-weight: bold;
            margin: 0 0 8px 0;
        }

        .level-section-title {
            font-size: 13px;
            font-weight: bold;
            color: #444;
            margin: 14px 0 6px 0;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .expression-svg {
            display: block;
            margin: 6px 0;
            background: transparent;
            border: 1px solid #e2e2e2;
            border-radius: 6px;
        }

        .tool-list {
            margin: 6px 0 14px 18px;
            padding: 0;
        }

        .tool-list li {
            margin-bottom: 4px;
        }

        .divider {
            width: 6px;
            cursor: col-resize;
            background: #ddd;
            flex: 0 0 6px;
        }

        .divider:hover {
            background: #bbb;
        }

        .main {
            flex: 1;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: visible;
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-width: 0;
        }


        .right-level-bar {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 7px;
            padding: 10px 12px 8px 12px;
            border-bottom: 1px solid #ddd;
            background: white;
            box-sizing: border-box;
        }

        .right-control-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .right-level-label {
            font-size: 13px;
            font-weight: bold;
            color: #444;
            white-space: nowrap;
        }

        .right-level-bar .panel-select {
            width: min(520px, 100%);
            margin-bottom: 0;
        }

        .level-file-input {
            max-width: min(520px, 100%);
            font-size: 13px;
        }

        .loaded-level-file-name {
            font-size: 12px;
            color: #666;
            overflow-wrap: anywhere;
        }

        .loaded-level-file-name.file-error {
            color: #a00000;
        }

        body.no-level-loaded #expressionWorkspaceSvg {
            pointer-events: none;
        }

        .geometry-select {
            width: auto !important;
            min-width: 88px;
            padding: 5px 7px;
        }

        .geometry-control-note {
            font-size: 11px;
            color: #777;
        }

        .mode-toggle {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-left: 6px;
            font-size: 13px;
            color: #333;
            white-space: nowrap;
        }

        .mode-toggle label {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        body.demo-mode-active .demo-target-button {
            background: #fff3bf;
            border-color: #d39b00;
            box-shadow: 0 0 0 4px rgba(240, 196, 0, 0.35);
        }

        body.demo-mode-active button.demo-blocked-button {
            cursor: default;
        }

        .right-top-bar {
            flex: 0 0 auto;
            padding: 10px 12px 8px 12px;
            border-bottom: 1px solid #ddd;
            background: white;
        }

        .right-top-bar {
            display: none;
        }

        body.inspect-mode .right-top-bar {
            display: block;
        }

        body.inspect-mode .right-svg-wrap {
            display: none;
        }

        .comparison-label {
            font-size: 13px;
            font-weight: bold;
            color: #444;
            margin: 8px 0 4px 0;
        }

        .right-top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .right-expression-wrap {
            flex: 1;
            min-width: 0;
            overflow-x: auto;
        }

        .right-svg-wrap {
            flex: 0 0 auto;
            position: relative;
            overflow-x: auto;
            overflow-y: visible;
            background: transparent;
            min-width: 0;
        }

        .inspect-exit-button.hidden {
            display: none;
        }

        
        .step-card {
            cursor: pointer;
            border: 2px dashed #b8b8b8;
            border-radius: 8px;
            padding: 2px 6px 6px 6px;
            margin: 0 0 8px 0;
            background: #ffffff;
        }

        .step-card .math-block {
            border: none;
            background: transparent;
        }

        .step-card:hover {
            background: #ffffff;
            border-color: #b8b8b8;
        }

        .step-card.completed-step:hover {
            background: #ffffff;
            border-color: #159947;
            box-shadow: 0 0 0 3px rgba(21, 153, 71, 0.22);
        }

        .step-card.completed-step {
            border: 4px solid #159947;
            box-shadow: 0 0 0 3px rgba(21, 153, 71, 0.22);
        }

        .step-card.completed-step .math-block {
            border: none;
            background: transparent;
        }

        .completion-export-button {
            width: 100%;
            margin: 2px 0 8px 0;
            padding: 8px 10px;
            border: 1px solid #159947;
            border-radius: 6px;
            background: #eefaf2;
            color: #126f37;
            font-weight: bold;
            cursor: pointer;
        }

        .completion-export-button:hover {
            background: #e1f6e8;
        }

        #moveHistoryControls:empty {
            display: none;
        }

        #moveHistoryControls:not(:empty) {
            position: sticky;
            bottom: 0;
            z-index: 5;
            padding-top: 6px;
            background: #fafafa;
        }

        body.expression-builder-active .left-panel {
            position: sticky;
            top: 0;
            align-self: flex-start;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        body.expression-builder-active #levelContent,
        body.expression-builder-active .panel-tool-menu {
            flex: 1 1 auto;
            min-height: 0;
            height: 100%;
        }

        body.expression-builder-active .panel-tool-menu {
            margin-top: 0;
        }

        body.expression-builder-active #moveHistoryControls {
            display: none;
        }



        body.inspect-mode .step-card {
            opacity: 0.28;
            filter: grayscale(1);
        }

        body.inspect-mode .step-card.inspect-selected-step {
            opacity: 1;
            filter: none;
            background: #fff3bf;
            border-color: #f0c400;
            box-shadow: 0 0 0 3px rgba(240, 196, 0, 0.25);
        }

        body.inspect-mode .main {
            background: #fff8d6;
            box-shadow: inset 0 0 0 6px rgba(240, 196, 0, 0.35);
        }

        body.inspect-mode .right-top-bar,
        body.inspect-mode .right-svg-wrap {
            background: #fff8d6;
        }

        .tool-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .tool-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            outline-offset: 2px;
            font-size: 14px;
            padding: 8px 10px;
            border: 1px solid #999;
            background: white;
            cursor: pointer;
        }

        button[disabled] {
            color: #999;
            border-color: #ccc;
            background: #f5f5f5;
            cursor: default;
        }

        .caption {
            font-size: 13px;
            color: #444;
            margin-bottom: 14px;
            line-height: 1.4;
        }

        .input-box {
            width: 100%;
            box-sizing: border-box;
            padding: 7px 8px;
            font-size: 14px;
            border: 1px solid #999;
            margin-bottom: 8px;
        }

        .small-note {
            font-size: 12px;
            color: #555;
            margin: 4px 0 8px 0;
            line-height: 1.3;
        }

        .floating-tool-menu {
            position: absolute;
            z-index: 100;
            min-width: 220px;
            max-width: 560px;
            padding: 8px;
            background: white;
            border: 1px solid #bbb;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
            border-radius: 8px;
        }

        .floating-tool-menu.hidden {
            display: none;
        }

        .floating-tool-menu .tool-grid {
            margin-bottom: 0;
        }

        .floating-tool-menu .tool-row {
            margin-bottom: 0;
        }

        .floating-tool-menu button {
            outline-offset: 2px;
            font-size: 13px;
            padding: 6px 8px;
            text-align: left;
            line-height: 1.25;
        }


        .floating-tool-menu button {
            text-align: left;
            line-height: 1.25;
        }

        .rule-name {
            display: block;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .rule-sentence {
            display: block;
            font-size: 12px;
            color: #333;
            font-weight: normal;
        }

        .rule-notation {
            display: block;
            font-size: 13px;
            color: #333;
            font-weight: normal;
        }

        .panel-tool-menu {
            margin-top: 8px;
        }

        .panel-tool-menu .tool-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .panel-tool-menu .tool-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .panel-tool-menu button {
            width: 100%;
            outline-offset: 2px;
            font-size: 13px;
            padding: 7px 8px;
            text-align: left;
            line-height: 1.25;
        }

        .panel-tool-menu .tool-row button {
            width: auto;
        }


        .panel-category-grid {
            display: grid;
            gap: 8px;
            margin-bottom: 12px;
        }

        .panel-category-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .panel-category-row.single {
            grid-template-columns: 1fr;
        }

        .panel-category-row button,
        .panel-menu-back-button {
            width: 100%;
            text-align: left;
        }

        .tool-form-section-title {
            font-size: 12px;
            font-weight: bold;
            color: #555;
            margin: 12px 0 6px 0;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .tool-form-grid {
            display: grid;
            gap: 7px;
            margin-bottom: 12px;
        }

        .tool-form-row {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            flex-wrap: nowrap;
            min-width: 0;
        }

        .tool-form-pair,
        .tool-form-triplet {
            display: grid;
            gap: 5px 6px;
            align-items: center;
            width: 100%;
            min-width: 0;
            margin: 2px 0;
        }

        .tool-form-pair {
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        }

        .tool-form-triplet {
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr);
        }

        .tool-form-pair .tool-form-button,
        .tool-form-pair .tool-form-static,
        .tool-form-triplet .tool-form-button,
        .tool-form-triplet .tool-form-static {
            width: 100%;
        }

        .tool-form-distribution-pair {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr);
            gap: 5px 6px;
            align-items: center;
            width: 100%;
            margin: 2px 0;
        }

        .tool-form-distribution-pair .tool-form-button,
        .tool-form-distribution-pair .tool-form-static {
            width: 100%;
        }

        .tool-form-distribution-empty {
            min-width: 0;
            min-height: 1px;
        }

        .tool-form-row.single {
            display: block;
        }

        .tool-form-row.single .tool-form-button,
        .tool-form-row.single .tool-form-static {
            width: 100%;
        }

        .tool-form-arrow {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 22px;
            font-size: 18px;
            color: #444;
            line-height: 1;
            flex: 0 0 auto;
        }

        .tool-form-button,
        .tool-form-static {
            min-width: 0;
            width: auto;
            box-sizing: border-box;
            text-align: center;
            line-height: 1.25;
            font-size: 13px;
            padding: 7px 6px;
        }

        .tool-form-static {
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #ddd;
            border-radius: 2px;
            background: white;
            color: #333;
        }

        .tool-form-label {
            display: block;
            overflow-wrap: anywhere;
        }

        .tool-form-conventional-label {
            display: inline-block;
            font-family: Consolas, "Courier New", monospace;
            font-size: 14px;
            white-space: nowrap;
            letter-spacing: 0;
        }

        .tool-form-conventional-action {
            display: block;
            margin-top: 4px;
            font-family: Verdana, Arial, sans-serif;
            font-size: 11px;
            line-height: 1.2;
            white-space: normal;
            color: #555;
        }

        .applicable-tool-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .applicable-tool-row {
            width: 100%;
        }

        .applicable-tool-button {
            width: 100%;
            padding: 8px 10px;
        }

        .applicable-tool-flow {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
        }

        .applicable-tool-side {
            flex: 1 1 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        .applicable-tool-side .mini-oops-svg {
            max-width: 100%;
        }

        .applicable-tool-arrow {
            flex: 0 0 auto;
            font-size: 18px;
            line-height: 1;
            color: #444;
        }

        .compact-insert-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px;
            margin-bottom: 12px;
        }

        .panel-tool-menu .compact-insert-button {
            width: 100%;
            min-height: 54px;
            padding: 4px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }

        .compact-insert-symbol {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 34px;
        }

        .compact-insert-button .mini-oops-svg {
            width: auto;
            max-width: 100%;
            max-height: 36px;
        }

        .compact-insert-caption {
            font-size: 11px;
            line-height: 1;
            color: #444;
        }

        .intent-category-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 8px;
        }

        .intent-category-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .intent-category-row.single {
            grid-template-columns: minmax(0, 1fr);
        }

        .panel-tool-menu .intent-category-button {
            min-height: 82px;
            padding: 7px 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #303030;
            text-align: center;
        }

        .intent-category-icon {
            display: block;
            width: 104px;
            height: 68px;
            overflow: visible;
        }

        .intent-category-math {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.42em;
            color: currentColor;
            font-family: "Cambria Math", "STIX Two Math", "Times New Roman", serif;
            font-size: 28px;
            line-height: 1;
            white-space: nowrap;
        }

        .intent-category-math.translate-notation-math {
            font-size: 25px;
            gap: 0.55em;
        }

        .intent-category-math sup {
            font-size: 0.58em;
            line-height: 0;
            vertical-align: 0.75em;
        }

        .intent-category-math .math-arrow {
            font-size: 1.15em;
            line-height: 1;
        }

        .intent-category-math .math-fraction {
            display: inline-grid;
            grid-template-rows: auto auto;
            justify-items: center;
            align-items: center;
            line-height: 1;
        }

        .intent-category-math .math-numerator {
            min-width: 2.6em;
            padding: 0 0.22em 0.12em;
            border-bottom: 0.07em solid currentColor;
        }

        .intent-category-math .math-denominator {
            padding-top: 0.13em;
        }

        .intent-category-icon .icon-stroke {
            fill: none;
            stroke: currentColor;
            stroke-width: 5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .intent-category-icon .icon-fill {
            fill: currentColor;
            stroke: none;
        }

        .tool-form-mini-label {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mini-oops-svg {
            display: block;
            max-width: 100%;
            height: auto;
        }

        .tool-form-inline-group {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            flex-wrap: nowrap;
            white-space: nowrap;
            overflow-x: auto;
            max-width: 100%;
        }

        .tool-form-inline-group .tool-form-button,
        .tool-form-inline-group .tool-form-static {
            flex: 0 0 auto;
            padding: 5px 4px;
        }

        .tool-form-or {
            flex: 0 0 auto;
            font-size: 12px;
            color: #555;
            font-style: italic;
        }

        .panel-tool-menu .tool-form-row:not(.single) .tool-form-button {
            width: auto;
        }

        .panel-tool-menu .tool-form-pair .tool-form-button,
        .panel-tool-menu .tool-form-triplet .tool-form-button,
        .panel-tool-menu .tool-form-distribution-pair .tool-form-button {
            width: 100%;
        }

        .panel-tool-menu .tool-form-row.single .tool-form-button {
            width: 100%;
        }

        .tool-form-button .rule-name,
        .tool-form-button .rule-notation {
            display: inline;
            font-size: 13px;
            font-weight: normal;
            color: inherit;
        }

        .panel-menu-title {
            font-size: 13px;
            font-weight: bold;
            color: #444;
            margin: 0 0 8px 0;
        }

        .panel-menu-back-button {
            margin-bottom: 10px;
        }

        .tool-exponent-mode {
            margin: 0 0 10px 0;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: nowrap;
            white-space: nowrap;
        }

        .tool-exponent-mode .panel-menu-title {
            margin: 0;
            flex: 0 0 auto;
        }

        .tool-exponent-radio-label {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            color: #333;
            flex: 0 0 auto;
        }

        .tool-exponent-radio-label input {
            margin: 0;
        }


        .floating-tool-menu button.tool-not-applicable,
        .panel-tool-menu button.tool-not-applicable {
            border-color: #c60000;
            background: #ffecec;
            color: #9c0000;
        }

        .floating-tool-menu button.tool-not-applicable .rule-notation,
        .panel-tool-menu button.tool-not-applicable .rule-notation {
            color: #9c0000;
        }

        body.preview-comparison-disabled .step-card {
            cursor: default;
        }

        body.preview-comparison-disabled .step-card:hover {
            background: #ffffff;
            border-color: #b8b8b8;
        }

        body.preview-comparison-disabled .step-card.completed-step:hover {
            background: #ffffff;
            border-color: #159947;
            box-shadow: 0 0 0 3px rgba(21, 153, 71, 0.22);
        }



        .expression-builder-panel {
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
            margin-top: 0;
        }

        .proposal-preview-panel {
            display: flex;
            flex: 1 1 auto;
            flex-direction: column;
            min-height: 0;
            margin: 0 0 8px 0;
            padding: 8px;
            background: #ffffff;
            border: 1px solid #d8d8d8;
            border-radius: 8px;
        }

        .proposal-preview-title {
            font-size: 13px;
            font-weight: bold;
            color: #444;
            margin-bottom: 6px;
        }

        .proposal-preview-oops {
            flex: 1 1 auto;
            min-height: 0;
            overflow: auto;
            padding: 2px 0;
        }

        .proposal-preview-oops svg {
            max-width: none;
        }

        .builder-message {
            flex: 0 0 auto;
            margin-top: 6px;
            font-weight: bold;
        }

        .builder-controls {
            flex: 0 0 auto;
        }

        .builder-keypad {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
            margin: 8px 0;
        }

        .builder-keypad button,
        .builder-variable-row button,
        .builder-navigation-row button,
        .builder-action-row button {
            text-align: center;
            font-size: 15px;
            padding: 10px 8px;
        }

        .builder-operator-button,
        .builder-negative-one-button {
            font-weight: bold;
        }

        .builder-zero-button {
            grid-column: 1 / span 3;
        }

        .builder-undo-button {
            font-size: 20px;
