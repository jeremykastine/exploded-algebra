<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Exploded Algebra Tool</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            font-family: Verdana, Arial, Helvetica, sans-serif;
            background: white;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .app-container {
            --landscape-panel-split: 33.333%;
            --portrait-panel-split: 50%;
            --divider-size: 6px;
            --divider-half-size: 3px;
            display: flex;
            width: 100%;
            min-height: 100vh;
            align-items: stretch;
        }

        .left-panel {
            width: var(--landscape-panel-split);
            min-width: 10%;
            max-width: 50%;
            overflow-x: hidden;
            overflow-y: visible;
            border-right: 1px solid #ccc;
            padding: 10px;
            box-sizing: border-box;
            background: #fafafa;
        }
        body.tool-area-active .left-panel { overflow: hidden; }


        .left-panel h2 {
            margin: 0 0 12px 0;
            font-size: 18px;
        }

        .left-panel p {
            margin: 0 0 10px 0;
            line-height: 1.4;
        }

        .left-panel .math-block {
            margin: 8px 0;
            padding: 0;
            height: auto;
            overflow: visible;
            background: transparent;
            border: none;
        }

        .level-intro {
            color: #444;
        }

        .panel-label {
            display: block;
            font-size: 13px;
            margin: 10px 0 6px 0;
            color: #444;
        }

        .panel-select {
            width: 100%;
            box-sizing: border-box;
            padding: 7px 8px;
            font-size: 14px;
            border: 1px solid #999;
            background: white;
            margin-bottom: 14px;
        }

        .level-title {
            font-size: 16px;
            font-weight: bold;
            margin: 0 0 8px 0;
        }

        .level-section-title {
            font-size: 13px;
            font-weight: bold;
            color: #444;
            margin: 14px 0 6px 0;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .expression-svg {
            display: block;
            margin: 6px 0;
            background: transparent;
            border: 1px solid #e2e2e2;
            border-radius: 6px;
        }

        .tool-list {
            margin: 6px 0 14px 18px;
            padding: 0;
        }

        .tool-list li {
            margin-bottom: 4px;
        }

        .divider {
            position: relative;
            width: var(--divider-size);
            cursor: col-resize;
            background: #ddd;
            flex: 0 0 var(--divider-size);
            touch-action: none;
            user-select: none;
        }

        .divider:hover {
            background: #bbb;
        }

        .main {
            flex: 1;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: visible;
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-width: 0;
        }


        .right-level-bar {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 7px;
            padding: 10px 12px 8px 12px;
            border-bottom: 1px solid #ddd;
            background: white;
            box-sizing: border-box;
        }

        .right-control-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .right-level-label {
            font-size: 13px;
            font-weight: bold;
            color: #444;
            white-space: nowrap;
        }

        .right-level-bar .panel-select {
            width: min(520px, 100%);
            margin-bottom: 0;
        }

        .level-file-input {
            max-width: min(520px, 100%);
            font-size: 13px;
        }

        .loaded-level-file-name {
            font-size: 12px;
            color: #666;
            overflow-wrap: anywhere;
        }

        .loaded-level-file-name.file-error {
            color: #a00000;
        }

        body.no-level-loaded #expressionWorkspaceSvg {
            pointer-events: none;
        }

        .geometry-select {
            width: auto !important;
            min-width: 88px;
            padding: 5px 7px;
        }

        .geometry-control-note {
            font-size: 11px;
            color: #777;
        }

        .mode-toggle {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-left: 6px;
            font-size: 13px;
            color: #333;
            white-space: nowrap;
        }

        .mode-toggle label {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        body.demo-mode-active .demo-target-button {
            background: #fff3bf;
            border-color: #d39b00;
            box-shadow: 0 0 0 4px rgba(240, 196, 0, 0.35);
        }

        body.demo-mode-active button.demo-blocked-button {
            cursor: default;
        }

        .right-top-bar {
            flex: 0 0 auto;
            padding: 10px 12px 8px 12px;
            border-bottom: 1px solid #ddd;
            background: white;
        }

        .right-top-bar {
            display: none;
        }

        body.inspect-mode .right-top-bar {
            display: block;
        }

        body.inspect-mode .right-svg-wrap {
            display: none;
        }

        .comparison-label {
            font-size: 13px;
            font-weight: bold;
            color: #444;
            margin: 8px 0 4px 0;
        }

        .right-top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .right-expression-wrap {
            flex: 1;
            min-width: 0;
            overflow-x: auto;
        }

        .right-svg-wrap {
            flex: 0 0 auto;
            position: relative;
            overflow-x: auto;
            overflow-y: visible;
            background: transparent;
            min-width: 0;
        }

        .inspect-exit-button.hidden {
            display: none;
        }

        
        .textbook-solution {
            color: #222222;
        }

        .solution-section {
            min-width: 0;
        }

        .problem-instruction {
            margin: 0 0 10px;
            font-size: 15px;
            font-weight: bold;
            line-height: 1.4;
        }

        .problem-expression {
            padding: 2px 0 4px;
        }

        .problem-expression .math-block {
            margin: 0;
            font-size: 1.08em;
        }

        .solution-separator {
            height: 0;
            margin: 14px 0;
            border: 0;
            border-top: 1px solid #bdbdbd;
        }

        .running-solution {
            display: grid;
            gap: 8px;
        }

        .solution-step {
            cursor: pointer;
            margin: 0;
            padding: 5px 7px;
            border: 2px solid transparent;
            border-radius: 5px;
            background: transparent;
        }

        .solution-step.completed-step {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .completed-step-check {
            flex: 0 0 auto;
            color: #159947;
            font-size: 18px;
            font-weight: bold;
            line-height: 1;
        }

        .solution-step .math-block {
            min-width: 0;
            margin: 0;
            overflow: visible;
        }

        .exercise-guidance,
        .step-guidance {
            margin: 8px 2px 10px;
            color: #333333;
            font-size: 14px;
            line-height: 1.45;
        }

        .exercise-footer {
            padding-bottom: 2px;
        }

        .exercise-footer h3 {
            margin: 0 0 8px;
            font-size: 14px;
            line-height: 1.3;
        }

        .exercise-footer p:last-child,
        .step-guidance p:last-child {
            margin-bottom: 0;
        }

        .exercise-guidance p {
            margin: 0 0 8px;
        }

        .exercise-guidance ul {
            margin: 0;
            padding-left: 20px;
        }

        .exercise-guidance li {
            margin: 0 0 6px;
        }

        .step-guidance p {
            margin: 0 0 8px;
        }

        .step-guidance {
            margin-top: 2px;
            margin-bottom: 4px;
        }

        .completion-export-button {
            width: 100%;
            margin: 2px 0 8px 0;
            padding: 8px 10px;
            border: 1px solid #159947;
            border-radius: 6px;
            background: #eefaf2;
            color: #126f37;
            font-weight: bold;
            cursor: pointer;
        }

        .completion-export-button:hover {
            background: #e1f6e8;
        }

        #moveHistoryControls:empty {
            display: none;
        }

        #moveHistoryControls:not(:empty) {
            position: sticky;
            bottom: 0;
            z-index: 5;
            padding-top: 6px;
            background: #fafafa;
        }

        body.expression-builder-active .left-panel {
            position: sticky;
            top: 0;
            align-self: flex-start;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        body.expression-builder-active #levelContent,
        body.expression-builder-active .panel-tool-menu {
            flex: 1 1 auto;
            min-height: 0;
            height: 100%;
        }

        body.expression-builder-active .panel-tool-menu {
            margin-top: 0;
        }

        body.expression-builder-active #moveHistoryControls {
            display: none;
        }



        body.inspect-mode .step-card {
            opacity: 0.28;
            filter: grayscale(1);
        }

        body.inspect-mode .step-card.inspect-selected-step {
            opacity: 1;
            filter: none;
            background: #fff3bf;
            border-color: #f0c400;
            box-shadow: 0 0 0 3px rgba(240, 196, 0, 0.25);
        }

        body.inspect-mode .main {
            background: #fff8d6;
            box-shadow: inset 0 0 0 6px rgba(240, 196, 0, 0.35);
        }

        body.inspect-mode .right-top-bar,
        body.inspect-mode .right-svg-wrap {
            background: #fff8d6;
        }

        .tool-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .tool-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            outline-offset: 2px;
            font-size: 14px;
            padding: 8px 10px;
            border: 1px solid #999;
            background: white;
            cursor: pointer;
        }

        button[disabled] {
            color: #999;
            border-color: #ccc;
            background: #f5f5f5;
            cursor: default;
        }

        .caption {
            font-size: 13px;
            color: #444;
            margin-bottom: 14px;
            line-height: 1.4;
        }

        .input-box {
            width: 100%;
            box-sizing: border-box;
            padding: 7px 8px;
            font-size: 14px;
            border: 1px solid #999;
            margin-bottom: 8px;
        }

        .small-note {
            font-size: 12px;
            color: #555;
            margin: 4px 0 8px 0;
            line-height: 1.3;
        }

        .cancel-selection-button {
            width: 100%;
            margin-top: 10px;
            border-color: #777;
            background: #f5f5f5;
            text-align: center;
        }

        .floating-tool-menu {
            position: absolute;
            z-index: 100;
            min-width: 220px;
            max-width: 560px;
            padding: 8px;
            background: white;
            border: 1px solid #bbb;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
            border-radius: 8px;
        }

        .floating-tool-menu.hidden {
            display: none;
        }

        .builder-rewrite-preview {
            position: absolute;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 5px 7px;
            border-radius: 7px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 0 0 1px rgba(183, 123, 234, 0.3);
            pointer-events: none;
        }

        .builder-rewrite-preview.hidden {
            display: none;
        }

        .builder-rewrite-preview.vertical {
            flex-direction: column;
            gap: 7px;
        }

        .builder-rewrite-arrow {
            flex: 0 0 auto;
            color: #7040a0;
            font-size: 30px;
            font-weight: bold;
            line-height: 1;
        }

        .builder-rewrite-proposal {
            flex: 0 0 auto;
            min-width: 24px;
            min-height: 24px;
        }

        .builder-rewrite-proposal svg {
            display: block;
            max-width: none;
        }

        .floating-tool-menu .tool-grid {
            margin-bottom: 0;
        }

        .floating-tool-menu .tool-row {
            margin-bottom: 0;
        }

        .floating-tool-menu button {
            outline-offset: 2px;
            font-size: 13px;
            padding: 6px 8px;
            text-align: left;
            line-height: 1.25;
        }


        .floating-tool-menu button {
            text-align: left;
            line-height: 1.25;
        }

        .rule-name {
            display: block;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .rule-sentence {
            display: block;
            font-size: 12px;
            color: #333;
            font-weight: normal;
        }

        .rule-notation {
            display: block;
            font-size: 13px;
            color: #333;
            font-weight: normal;
        }

        .panel-tool-menu {
            margin-top: 8px;
        }

        .panel-tool-menu .tool-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .panel-tool-menu .tool-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .panel-tool-menu button {
            width: 100%;
            outline-offset: 2px;
            font-size: 13px;
            padding: 7px 8px;
            text-align: left;
            line-height: 1.25;
        }

        .panel-tool-menu .tool-row button {
            width: auto;
        }


        .panel-category-grid {
            display: grid;
            gap: 8px;
            margin-bottom: 12px;
        }

        .panel-category-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .panel-category-row.single {
            grid-template-columns: 1fr;
        }

        .panel-category-row button,
        .panel-menu-back-button {
            width: 100%;
            text-align: left;
        }

        .tool-form-section-title {
            font-size: 12px;
            font-weight: bold;
            color: #555;
            margin: 12px 0 6px 0;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .tool-form-grid {
            display: grid;
            gap: 7px;
            margin-bottom: 12px;
        }

        .tool-form-row {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            flex-wrap: nowrap;
            min-width: 0;
        }

        .tool-form-pair,
        .tool-form-triplet {
            display: grid;
            gap: 5px 6px;
            align-items: center;
            width: 100%;
            min-width: 0;
            margin: 2px 0;
        }

        .tool-form-pair {
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        }

        .tool-form-triplet {
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr);
        }

        .tool-form-pair .tool-form-button,
        .tool-form-pair .tool-form-static,
        .tool-form-triplet .tool-form-button,
        .tool-form-triplet .tool-form-static {
            width: 100%;
        }

        .tool-form-distribution-pair {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr);
            gap: 5px 6px;
            align-items: center;
            width: 100%;
            margin: 2px 0;
        }

        .tool-form-distribution-pair .tool-form-button,
        .tool-form-distribution-pair .tool-form-static {
            width: 100%;
        }

        .tool-form-distribution-empty {
            min-width: 0;
            min-height: 1px;
        }

        .tool-form-row.single {
            display: block;
        }

        .tool-form-row.single .tool-form-button,
        .tool-form-row.single .tool-form-static {
            width: 100%;
        }

        .tool-form-arrow {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 22px;
            font-size: 18px;
            color: #444;
            line-height: 1;
            flex: 0 0 auto;
        }

        .tool-form-button,
        .tool-form-static {
            min-width: 0;
            width: auto;
            box-sizing: border-box;
            text-align: center;
            line-height: 1.25;
            font-size: 13px;
            padding: 7px 6px;
        }

        .tool-form-static {
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #ddd;
            border-radius: 2px;
            background: white;
            color: #333;
        }

        .tool-form-label {
            display: block;
            overflow-wrap: anywhere;
        }

        .tool-form-conventional-label {
            display: inline-block;
            font-family: Consolas, "Courier New", monospace;
            font-size: 14px;
            white-space: nowrap;
            letter-spacing: 0;
        }

        .tool-form-conventional-action {
            display: block;
            margin-top: 4px;
            font-family: Verdana, Arial, sans-serif;
            font-size: 11px;
            line-height: 1.2;
            white-space: normal;
            color: #555;
        }

        .applicable-tool-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .applicable-tool-row {
            width: 100%;
        }

        .applicable-tool-button {
            width: 100%;
            padding: 8px 10px;
        }

        .applicable-tool-flow {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
        }

        .applicable-tool-side {
            flex: 1 1 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        .applicable-tool-side .mini-oops-svg {
            max-width: 100%;
        }

        .applicable-tool-arrow {
            flex: 0 0 auto;
            font-size: 18px;
            line-height: 1;
            color: #444;
        }

        .insert-choice-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .panel-tool-menu .insert-choice-button {
            width: 100%;
            min-height: 42px;
            padding: 9px 12px;
            text-align: left;
        }

        .insert-choice-description {
            margin: 0 4px 2px;
            min-height: 3.3em;
            color: #555;
            font-size: 12px;
            line-height: 1.35;
        }

        .insert-choice-description p {
            margin: 0;
        }

        .intent-category-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 8px;
        }

        .intent-category-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .intent-category-row.single {
            grid-template-columns: minmax(0, 1fr);
        }

        .intent-category-description {
            margin: -3px 4px 2px;
            min-height: 3.3em;
            color: #555;
            font-size: 12px;
            line-height: 1.35;
        }

        .intent-category-description p {
            margin: 0;
        }

        .intent-category-description ul {
            margin: 6px 0 0;
            padding-left: 20px;
        }

        .intent-category-description li {
            margin: 0 0 3px;
        }

        .panel-tool-menu .intent-category-button {
            min-height: 82px;
            padding: 7px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            color: #303030;
            text-align: center;
        }

        .intent-category-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            line-height: 1.15;
        }

        .intent-category-icon {
            display: block;
            width: 104px;
            height: 68px;
            overflow: visible;
        }

        .intent-category-math {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.42em;
            color: currentColor;
            font-family: "Cambria Math", "STIX Two Math", "Times New Roman", serif;
            font-size: 28px;
            line-height: 1;
            white-space: nowrap;
        }

        .intent-category-math .math-arrow {
            font-size: 1.15em;
            line-height: 1;
        }

        .intent-category-icon .icon-stroke {
            fill: none;
            stroke: currentColor;
            stroke-width: 5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .intent-category-icon .icon-fill {
            fill: currentColor;
            stroke: none;
        }

        .tool-form-mini-label {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mini-oops-svg {
            display: block;
            max-width: 100%;
            height: auto;
        }

        .tool-form-inline-group {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            flex-wrap: nowrap;
            white-space: nowrap;
            overflow-x: auto;
            max-width: 100%;
        }

        .tool-form-inline-group .tool-form-button,
        .tool-form-inline-group .tool-form-static {
            flex: 0 0 auto;
            padding: 5px 4px;
        }

        .tool-form-or {
            flex: 0 0 auto;
            font-size: 12px;
            color: #555;
            font-style: italic;
        }

        .panel-tool-menu .tool-form-row:not(.single) .tool-form-button {
            width: auto;
        }

        .panel-tool-menu .tool-form-pair .tool-form-button,
        .panel-tool-menu .tool-form-triplet .tool-form-button,
        .panel-tool-menu .tool-form-distribution-pair .tool-form-button {
            width: 100%;
        }

        .panel-tool-menu .tool-form-row.single .tool-form-button {
            width: 100%;
        }

        .tool-form-button .rule-name,
        .tool-form-button .rule-notation {
            display: inline;
            font-size: 13px;
            font-weight: normal;
            color: inherit;
        }

        .panel-menu-title {
            font-size: 13px;
            font-weight: bold;
            color: #444;
            margin: 0 0 8px 0;
        }

        .panel-menu-back-button {
            margin-bottom: 10px;
        }

        .tool-mode {
            margin: 0 0 10px 0;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: nowrap;
            white-space: nowrap;
        }

        .tool-mode .panel-menu-title {
            margin: 0;
            flex: 0 0 auto;
        }

        .tool-mode-radio-label {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            color: #333;
            flex: 0 0 auto;
        }

        <div id="leftPanel" class="left-panel">
            <div id="levelContent"></div>
        </div>
        <div class="quadrant-tools">
            <div id="workspaceToolbar" class="workspace-toolbar" role="toolbar" aria-label="Expression workspace tools">
                <div class="workspace-tool-group workspace-selection-group" aria-label="Selection tools">
                    <button type="button" data-workspace-mode="select" class="is-active" aria-pressed="true" aria-label="Select" data-hold-description="Select the nearest visible part of the expression. Additional clicks expand the selection; a drag treats its start and end as two clicks.">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l6.8 16 2.2-6 6-2.2L5 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
                    </button>
                    <button type="button" data-workspace-action="cancelSelection" aria-label="Clear selection" data-hold-description="Clear the current selection without changing the expression." disabled>
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="13" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-dasharray="2.4 2.4"/><path d="M14.5 13.5L21 20M21 13.5L14.5 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    </button>
                </div>
                <div class="workspace-tool-group workspace-zoom-group" aria-label="Zoom tools">
                    <button type="button" data-workspace-mode="zoomIn" aria-pressed="false" aria-label="Zoom in" data-hold-description="Make the expression larger. Click the expression to zoom toward that point.">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5L21 21M10.5 7v7M7 10.5h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    </button>
                    <button type="button" data-workspace-mode="zoomOut" aria-pressed="false" aria-label="Zoom out" data-hold-description="Make the expression smaller.">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5L21 21M7 10.5h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    </button>
                    <button type="button" data-workspace-action="resetZoom" aria-label="Reset zoom and recenter" data-hold-description="Return the expression to 100% zoom and center it in the workspace.">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.2 7.2A7 7 0 1 1 5 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M3.5 4.5v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><text x="12" y="15" text-anchor="middle" font-size="6.5" font-weight="700" fill="currentColor">100</text></svg>
                    </button>
                </div>
            </div>
        </div>
        <div class="main" id="mainArea">
            <div id="rightTopBar" class="right-top-bar">
                <div class="right-top-row">
                    <div class="right-expression-wrap">
                        <div class="level-section-title">Preview Comparison</div>
                        <div class="comparison-label">Target step — grouping preview</div>
                        <svg id="targetExpressionSvg" class="expression-svg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Target step grouping preview"></svg>
                        <div class="comparison-label">Current expression — grouping preview</div>
                        <svg id="currentExpressionSvg" class="expression-svg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Current expression grouping preview"></svg>
                    </div>
                </div>
            </div>
            <div id="svgContainer" class="right-svg-wrap">
                <svg id="expressionWorkspaceSvg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Exploded Algebra expression workspace"></svg>
                <div id="floatingToolMenu" class="floating-tool-menu hidden"></div>
                <div id="builderRewritePreview" class="builder-rewrite-preview hidden" aria-live="polite" aria-label="Proposed replacement"></div>
            </div>
            <div id="builderKeypadPanel" class="builder-keypad-panel hidden" role="group" aria-label="Expression builder keypad">
                <div id="builderInputRail" class="builder-input-rail hidden">
                    <div id="builderVariableRail" class="builder-variable-rail" aria-label="Expression builder variables"></div>
                    <div id="builderDigitRail" class="builder-digit-rail" aria-label="Expression builder digits">
                        <button type="button" data-builder-action="digit" data-value="9">9</button>
                        <button type="button" data-builder-action="digit" data-value="8">8</button>
                        <button type="button" data-builder-action="digit" data-value="7">7</button>
                        <button type="button" data-builder-action="digit" data-value="6">6</button>
                        <button type="button" data-builder-action="digit" data-value="5">5</button>
                        <button type="button" data-builder-action="digit" data-value="4">4</button>
                        <button type="button" data-builder-action="digit" data-value="3">3</button>
                        <button type="button" data-builder-action="digit" data-value="2">2</button>
                        <button type="button" data-builder-action="digit" data-value="1">1</button>
                        <button type="button" data-builder-action="digit" data-value="0">0</button>
                    </div>
                </div>
                <div id="builderCommandPanel" class="builder-command-panel"></div>
            </div>
            <div id="numericalRewriteError" class="numerical-rewrite-error hidden" role="alert" aria-live="assertive"></div>
            <div id="pressHoldPopover" class="press-hold-popover hidden" role="tooltip" aria-live="polite"></div>
        </div>
        <div id="divider" class="divider" role="separator" tabindex="0" aria-label="Resize the expression workspace and multipurpose panel" aria-orientation="horizontal" aria-valuemin="45" aria-valuemax="90" aria-valuenow="78"></div>
    </div>
    <div id="toolOptionMenu" class="tool-option-menu hidden" role="menu" aria-label="Application options"></div>
    <script src="exploded-algebra-renderer.js?v=20260910-center-pinched-gradient-arcs-v2"></script>
    <script src="exploded-algebra-tool.js?v=20260910-center-pinched-gradient-arcs-v2"></script>

</body>
