<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exploded Algebra Exercises</title>
  <style>
    body {
      margin: 0;
      background: white;
      color: #1f1f1f;
      font-family: Verdana, Arial, Helvetica, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 48px 22px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 7vw, 3rem);
      line-height: 1.15;
    }

    p { margin: 0 0 14px; }

    a {
      color: #111;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .upload-row { display: grid; gap: 8px; margin-top: 28px; }
    .device-note { margin-top: 22px; color: #555; }
    label { font-weight: bold; }
    input { font: inherit; }
    #customLevelFileStatus { min-height: 1.5em; color: #555; }

    @media (max-width: 520px) {
      main { padding: 30px 16px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Try Exploded Algebra</h1>
    <p>Upload a compatible exercise file to begin.</p>
    <p class="device-note">For now, touch-screen and mobile devices are not recommended.</p>

    <div class="upload-row">
      <label for="customLevelFileInput">Upload an exercise file:</label>
      <input id="customLevelFileInput" type="file" accept=".json,application/json">
      <span id="customLevelFileStatus" aria-live="polite"></span>
    </div>

  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const customLevelStorageKey = 'explodedAlgebra.currentCustomLevel';
      const customLevelWindowNamePrefix = '__EXPLODED_ALGEBRA_LEVEL__:';
      const customLevelFileInput = document.getElementById('customLevelFileInput');
      const customLevelFileStatus = document.getElementById('customLevelFileStatus');

      function clearLevelTransfer() {
        try {
          window.sessionStorage.removeItem(customLevelStorageKey);
        } catch (error) {
          // file:// pages can have browser-specific storage behavior.
        }
        if (typeof window.name === 'string' && window.name.startsWith(customLevelWindowNamePrefix)) {
          window.name = '';
        }
      }

      function saveLevelTransfer(fileName, levelText) {
        const payloadText = JSON.stringify({
          version: 1,
          fileName: fileName,
          text: levelText
        });

        let sessionSaved = false;
        try {
          window.sessionStorage.setItem(customLevelStorageKey, payloadText);
          sessionSaved = true;
        } catch (error) {
          // window.name is the local-file fallback below.
        }

        window.name = customLevelWindowNamePrefix + payloadText;
        if (!sessionSaved && !window.name.startsWith(customLevelWindowNamePrefix)) {
          throw new Error('This browser could not carry the selected exercise into the app page.');
        }
      }

      if (customLevelFileInput) {
        customLevelFileInput.addEventListener('change', async function (event) {
          const file = event.target.files && event.target.files[0];
          if (!file) {
            return;
          }

          if (customLevelFileStatus) {
            customLevelFileStatus.textContent = 'Loading ' + file.name + '…';
          }

          try {
            clearLevelTransfer();
            saveLevelTransfer(file.name, await file.text());
            window.location.href = 'exploded-algebra.html?level=' + encodeURIComponent(file.name) + '&source=custom';
          } catch (error) {
            if (customLevelFileStatus) {
              customLevelFileStatus.textContent = error && error.message
                ? error.message
                : 'The selected file could not be opened.';
            }
            customLevelFileInput.value = '';
          }
        });
      }
    });
  </script>
</body>
</html>
