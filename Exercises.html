<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exploded Algebra Exercises</title>
  <link rel="stylesheet" href="last-updated.css?v=20260923-top-right">
  <style>
    body {
      margin: 0;
      background: white;
      color: #1f1f1f;
      font-family: Verdana, Arial, Helvetica, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 48px 22px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 7vw, 3rem);
      line-height: 1.15;
    }

    p { margin: 0 0 14px; }

    a {
      color: #111;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .upload-row { display: grid; gap: 8px; margin-top: 28px; }
    label { font-weight: bold; }
    input { font: inherit; }
    #customLevelFileStatus { min-height: 1.5em; color: #555; }

    @media (max-width: 520px) {
      main { padding: 30px 16px; }
    }
  </style>
</head>
<body>
  <p class="page-last-updated">Last updated: <time datetime="2026-11-21T21:41:47-05:00">11/21/26, 9:41 PM EST</time></p>
  <main>
    <h1>Try Exploded Algebra</h1>
    <p><a href="exploded-algebra.html">Use Exploded Algebra</a> to build and transform your own expression, or choose Guided Replay from the workspace menu to follow a saved run.</p>
    <p>Open a moves text file to follow its guided replay. Older JSON recordings also work.</p>
    <div class="upload-row">
      <label for="customLevelFileInput">Open a moves file:</label>
      <input id="customLevelFileInput" type="file" accept=".txt,text/plain,.json,application/json">
      <span id="customLevelFileStatus" aria-live="polite"></span>
    </div>
  </main>
  <script src="moves-codec.js?v=20261117-click-targets-v2"></script>
  <script src="level-transfer.js?v=20261116-player-menu"></script>
  <script>
    const fileInput = document.getElementById("customLevelFileInput");
    const fileStatus = document.getElementById("customLevelFileStatus");
    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      if (!file) return;

      const player = window.open("about:blank", "_blank") || window;
      try {
        const text = (await file.text()).trim();
        if (text.startsWith("{")) JSON.parse(text);
        else ExplodedAlgebraMoves.decode(text);
        const options = { mode: "guided" };
        ExplodedAlgebraTransfer.open("exploded-algebra.html", { source: "custom", level: file.name, ...options },
          { fileName: file.name, text }, player);
        fileStatus.textContent = "";
      } catch (error) {
        if (player !== window) player.close();
        fileStatus.textContent = error.message || "The selected file could not be opened.";
      } finally {
        fileInput.value = "";
      }
    });
  </script>
</body>
</html>
