  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const customLevelStorageKey = 'explodedAlgebra.currentCustomLevel';
      const customLevelWindowNamePrefix = '__EXPLODED_ALGEBRA_LEVEL__:';
      const builtInExerciseLinks = document.querySelectorAll('[data-exercise-file]');
      const customLevelFileInput = document.getElementById('customLevelFileInput');
      const customLevelFileStatus = document.getElementById('customLevelFileStatus');

      const builtInLevelDataIds = {
        'levels/multiply-binomials-and-combine-like-terms.json': 'builtInLevelDataMultiplyBinomials',
        'levels/rewrite-and-simplify-negative-6-plus-4.json': 'builtInLevelDataRewriteNegative6Plus4'
      };

      function clearLevelTransfer() {
        try {
          window.sessionStorage.removeItem(customLevelStorageKey);
        } catch (error) {
          // file:// pages can have browser-specific storage behavior.
        }
        if (typeof window.name === 'string' && window.name.startsWith(customLevelWindowNamePrefix)) {
          window.name = '';
        }
      }

      function saveLevelTransfer(fileName, levelText) {
        const payloadText = JSON.stringify({
          version: 1,
          fileName: fileName,
          text: levelText
        });

        let sessionSaved = false;
        try {
          window.sessionStorage.setItem(customLevelStorageKey, payloadText);
          sessionSaved = true;
        } catch (error) {
          // window.name is the local-file fallback below.
        }

        window.name = customLevelWindowNamePrefix + payloadText;
        if (!sessionSaved && !window.name.startsWith(customLevelWindowNamePrefix)) {
          throw new Error('This browser could not carry the selected exercise into the app page.');
        }
      }

      function getBuiltInLevelText(levelFile) {
        const scriptId = builtInLevelDataIds[levelFile];
        const dataNode = scriptId ? document.getElementById(scriptId) : null;
        if (!dataNode) {
          throw new Error('The selected built-in exercise is not bundled with this page.');
        }
        return dataNode.textContent.trim();
      }

      function openBuiltInLevel(levelFile) {
        if (!levelFile) {
          return;
        }
        clearLevelTransfer();
        saveLevelTransfer(levelFile, getBuiltInLevelText(levelFile));
        window.location.href = 'exploded-algebra.html?level=' + encodeURIComponent(levelFile) + '&source=builtin';
      }

      builtInExerciseLinks.forEach(function (link) {
        link.addEventListener('click', function (event) {
          event.preventDefault();
          try {
            openBuiltInLevel(link.dataset.exerciseFile);
          } catch (error) {
            if (customLevelFileStatus) {
              customLevelFileStatus.textContent = error && error.message
                ? error.message
                : 'The built-in exercise could not be opened.';
            }
          }
        });
      });

      if (customLevelFileInput) {
        customLevelFileInput.addEventListener('change', async function (event) {
          const file = event.target.files && event.target.files[0];
          if (!file) {
            return;
          }

          if (customLevelFileStatus) {
            customLevelFileStatus.textContent = 'Loading ' + file.name + '…';
          }

          try {
            clearLevelTransfer();
            saveLevelTransfer(file.name, await file.text());
            window.location.href = 'exploded-algebra.html?level=' + encodeURIComponent(file.name) + '&source=custom';
          } catch (error) {
            if (customLevelFileStatus) {
              customLevelFileStatus.textContent = error && error.message
                ? error.message
                : 'The selected file could not be opened.';
            }
            customLevelFileInput.value = '';
          }
        });
      }
    });
  </script>
