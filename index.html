<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exploded Algebra</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #fff;
      color: #1f1f1f;
      font-family: Verdana, Arial, Helvetica, sans-serif;
    }

    main {
      box-sizing: border-box;
      width: min(100%, 960px);
      margin: 0 auto;
      padding: 64px 24px;
    }

    h1 {
      margin: 0 0 36px;
      text-align: center;
      font-size: clamp(2rem, 6vw, 3rem);
      line-height: 1.15;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }

    .choice {
      box-sizing: border-box;
      min-height: 170px;
      padding: 28px;
      border: 2px solid #555;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #111;
      text-align: center;
      text-decoration: none;
      font-size: clamp(1.15rem, 3vw, 1.5rem);
      font-weight: bold;
      line-height: 1.35;
    }

    .choice:hover { background: #f3f3f3; }
    .choice:focus-visible { outline: 4px solid #78aeda; outline-offset: 4px; }

    @media (max-width: 520px) {
      main { padding: 36px 14px; }
      .choices { gap: 12px; }
      .choice { min-height: 150px; padding: 16px 10px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Welcome to Exploded Algebra</h1>
    <nav class="choices" aria-label="Choose how to begin">
      <a class="choice" href="Introduction.html">Want to read a quick introduction?</a>
      <a class="choice" href="Exercises.html">Want to try it out yourself?</a>
    </nav>
  </main>
</body>
</html>
