<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Exercise Builder — Exploded Algebra</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="exercise-builder.css?v=20260917-phase4-delete-step">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="exercise-builder.js?v=20260917-phase4-delete-step"></script>
</head>
<body>
  <main>
    <section class="phase" data-phase="1">
      <form id="setupForm" class="card form-card" aria-label="Exercise setup" novalidate>
        <div class="field-grid two-columns">
          <label>Exercise / level name
            <input id="exerciseTitle" name="title" required autocomplete="off" placeholder="Add fractions with unlike denominators">
          </label>
          <label>ID / slug
            <input id="exerciseId" name="id" required autocomplete="off" pattern="[A-Za-z0-9_-]+" placeholder="add-unlike-fractions">
            <small>Letters, numbers, hyphens, and underscores only.</small>
          </label>
        </div>
        <fieldset>
          <legend>Numerical rewrite permissions</legend>
          <div class="field-grid two-columns">
            <label>Addition
              <select id="additionPermission">
                <option value="none">None</option>
                <option value="no-carry">No carrying</option>
                <option value="flat">Flat sums with carrying</option>
                <option value="expression-terms" selected>Unrestricted expression terms</option>
              </select>
            </label>
            <label>Multiplication
              <select id="multiplicationPermission">
                <option value="none">None</option>
                <option value="one-significant-figure">One significant figure per factor</option>
                <option value="unrestricted" selected>Unrestricted</option>
              </select>
            </label>
            <div class="check-stack">
              <label class="check-label"><input id="allowNegativeOne" type="checkbox" checked> Allow −1 in numerical rewrites</label>
              <label class="check-label"><input id="allowInverses" type="checkbox" checked> Allow inverses in numerical rewrites</label>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>Recorded undo actions</legend>
          <p class="field-help">Choose whether High assistance should replay failed approaches and their undos.</p>
          <div class="radio-row">
            <label><input type="radio" name="includeUndo" value="yes"> Yes — include undo actions</label>
            <label><input type="radio" name="includeUndo" value="no" checked> No — keep the surviving solution path</label>
          </div>
        </fieldset>

        <p id="setupError" class="form-error" role="alert"></p>
        <div class="phase-actions end">
          <button class="primary-button" type="submit">Continue to Starting Expression</button>
        </div>
      </form>
    </section>

    <section class="phase" data-phase="2" hidden>
      <div id="phase2WorkspaceSlot"></div>
      <p id="initialExpressionStatus" class="visually-hidden" aria-live="polite">Build and submit the starting expression.</p>
    </section>

    <section class="phase" data-phase="3" hidden>
      <div id="phase3WorkspaceSlot"></div>
    </section>

    <section class="phase" data-phase="4" hidden>
      <section class="step-curation-section" aria-label="Exercise steps">
        <div id="curationTable" class="step-carousel" aria-roledescription="carousel" aria-label="Recorded solution steps"></div>
      </section>

      <section class="phase4-controls">
        <button id="deleteStepButton" type="button" class="secondary-button delete-step-button" hidden>Delete Step</button>
        <button id="completeExerciseButton" type="button" class="primary-button complete-exercise-button" hidden>All Done</button>
        <p id="exportStatus" class="status-line" aria-live="polite"></p>
      </section>
    </section>
  </main>

  <div id="workspaceShell" class="workspace-shell card">
    <iframe id="eaWorkspace" title="Exploded Algebra authoring workspace" src="exploded-algebra.html?authoring=builder&amp;v=20260918-visible-builder-x"></iframe>
  </div>
</body>
</html>
